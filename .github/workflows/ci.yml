name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript checks (app and Worker)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/robots.txt
          test -f dist/auth/callback.html
          test -f dist/assets/images/Anilife-Logo.png

      - name: Worker smoke test (local, no provider network)
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health >/dev/null
          node scripts/smoke.mjs http://127.0.0.1:8787

      - name: Show Worker log on failure
        if: failure()
        run: cat wrangler.log || true
