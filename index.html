<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anilife - Anime Streaming</title>
    <link rel="icon" type="image/png" href="/assets/images/Anilife-Logo.png" />
    <link rel="apple-touch-icon" href="/assets/images/Anilife-Logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anilife" />
    <meta name="description" content="Anilife: Stream your favorite anime whenever and wherever." />
    <meta property="og:title" content="Anilife - Anime Streaming" />
    <meta property="og:description" content="Anilife: Stream your favorite anime whenever and wherever." />
    <meta property="og:image" content="/assets/images/Anilife-Logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/images/Anilife-Logo.png" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('anilife_settings_v3') || 'null');
          const accent = saved && /^#[0-9a-f]{6}$/i.test(saved.accentColor) ? saved.accentColor : '#74cf66';
          const canvasMode = saved?.canvasBackground || (matchMedia('(prefers-color-scheme: dark)').matches ? 'amoled' : 'dark');
          const canvas = canvasMode === 'amoled' ? '#000000' : '#121214';
          document.documentElement.style.setProperty('--anilife-accent', accent);
          document.documentElement.style.setProperty('--anilife-canvas', canvas);
          document.querySelector('meta[name="theme-color"]').content = canvas;
        } catch {}
      })();
    </script>
  </head>
  <body class="bg-black text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
