<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anilife - AniList Login</title>
  <style>
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #141418;
      border: 1px solid #74cf66;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(116, 207, 102, 0.2);
      border-top-color: #74cf66;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px 0; font-weight: 700; color: #74cf66; }
    p { font-size: 13px; color: #a1a1aa; margin: 0; line-height: 1.5; }
    a.button {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #74cf66;
      color: #000;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Connecting to AniList</h2>
    <p id="msg">Completing sign in...</p>
    <a class="button" id="back" href="/" style="display:none">Back to Anilife</a>
  </div>
  <script>
    (function() {
      var hash = new URLSearchParams(window.location.hash.substring(1));
      var query = new URLSearchParams(window.location.search);
      var token = hash.get('access_token') || query.get('access_token');
      var error = hash.get('error') || query.get('error');
      var detail = hash.get('error_description') || query.get('error_description');

      function fail(message) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Sign in did not finish';
        document.getElementById('msg').textContent = message;
        document.getElementById('back').style.display = 'inline-block';
      }

      function finish(tok) {
        try {
          localStorage.setItem('anilife_oauth_token', tok);
        } catch (e) {}

        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_AUTH_SUCCESS', token: tok }, window.location.origin);
          document.getElementById('title').textContent = 'Connected';
          document.getElementById('msg').textContent = 'Success. Closing window...';
          setTimeout(function() { window.close(); }, 500);
        } else {
          document.getElementById('title').textContent = 'Connected';
          document.getElementById('msg').textContent = 'Success. Redirecting back to Anilife...';
          setTimeout(function() { window.location.href = '/'; }, 800);
        }
      }

      if (token) {
        finish(token);
      } else if (error) {
        fail(error + (detail ? ': ' + detail : ''));
      } else {
        fail('No token was returned. Open Anilife and try signing in again.');
      }
    })();
  </script>
</body>
</html>
