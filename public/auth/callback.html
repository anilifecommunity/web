<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anilife - AniList Login</title>
  <style>
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #141418;
      border: 1px solid #74cf66;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(116, 207, 102, 0.2);
      border-top-color: #74cf66;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px 0; font-weight: 700; color: #74cf66; }
    p { font-size: 13px; color: #a1a1aa; margin: 0; line-height: 1.5; }
    a.button {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #74cf66;
      color: #000;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Connecting to AniList</h2>
    <p id="msg">Completing sign in...</p>
    <a class="button" id="back" href="/" style="display:none">Back to Anilife</a>
  </div>
  <script>
    (function() {
      var hashParams = new URLSearchParams(window.location.hash.substring(1));
      var queryParams = new URLSearchParams(window.location.search);
      var token = hashParams.get('access_token');
      var state = hashParams.get('state');
      var error = hashParams.get('error') || queryParams.get('error');
      var detail = hashParams.get('error_description') || queryParams.get('error_description');
      var pendingState = null;

      try {
        pendingState = sessionStorage.getItem('anilife_oauth_state_v1');
        sessionStorage.removeItem('anilife_oauth_state_v1');
      } catch (e) {}

      history.replaceState(null, '', window.location.pathname);

      function fail(message) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Sign in did not finish';
        document.getElementById('msg').textContent = message;
        document.getElementById('back').style.display = 'inline-block';
      }

      if (error) {
        fail(error + (detail ? ': ' + detail : ''));
        return;
      }

      if (!token) {
        fail('No token was returned. Open Anilife and try signing in again.');
        return;
      }

      if (!state || !pendingState || state !== pendingState || pendingState.length < 32) {
        fail('Sign in could not be verified. Open Anilife and try again.');
        return;
      }

      try {
        localStorage.setItem('anilife_oauth_token_v2', token);
        sessionStorage.removeItem('anilife_oauth_token');
      } catch (e) {
        fail('Anilife could not save the sign-in on this browser.');
        return;
      }

      document.getElementById('title').textContent = 'Signing you in';
      document.getElementById('msg').textContent = 'Loading Anilife...';
      window.location.replace('/');
    })();
  </script>
</body>
</html>
