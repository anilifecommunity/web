<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anilife - AniList Login</title>
  <style>
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #141418;
      border: 1px solid #74cf66;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(116, 207, 102, 0.2);
      border-top-color: #74cf66;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px 0; font-weight: 700; color: #74cf66; }
    p { font-size: 13px; color: #a1a1aa; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Connecting to AniList</h2>
    <p id="msg">Completing sign in...</p>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.hash.substring(1));
      var token = params.get('access_token');
      var error = new URLSearchParams(window.location.search).get('error');

      function finish(tok) {
        try {
          localStorage.setItem('anilife_oauth_token', tok);
        } catch (e) {}

        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_AUTH_SUCCESS', token: tok }, window.location.origin);
          document.getElementById('msg').textContent = 'Success. Closing window...';
          setTimeout(function() { window.close(); }, 500);
        } else {
          document.getElementById('msg').textContent = 'Success. Redirecting back to Anilife...';
          setTimeout(function() { window.location.href = '/'; }, 800);
        }
      }

      if (token) {
        finish(token);
      } else if (error) {
        document.getElementById('msg').textContent = 'AniList returned: ' + error;
      } else {
        document.getElementById('msg').textContent = 'No token was returned.';
      }
    })();
  </script>
</body>
</html>
